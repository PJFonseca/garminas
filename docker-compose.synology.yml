# GarmiNAS for Synology Container Manager.
#
# Paste this into a new Container Manager project and it does the rest: it
# pulls the published image, starts the three containers, and serves the setup
# page on port 8090. Nothing to build, nothing to import, no .env file.
#
# It differs from docker-compose.yml in two ways, both because Container
# Manager has no command line to pass flags to: the model service is not behind
# a compose profile, so it starts with everything else, and there is no build
# step. It waits for the model file by itself, logging "waiting for
# /models/model.gguf" until the setup page has downloaded one.
#
# The :z on the volumes relabels them for SELinux, which Fedora and RHEL
# enforce and DSM does not. It is ignored where there is no SELinux, so it
# costs nothing here and saves anyone who runs this file on a Linux box.
#
# Every setting has a value here rather than in a .env. To change the timezone,
# a memory limit or the port, edit it in the Container Manager editor.

services:
  garmin:
    image: ghcr.io/pjfonseca/garminas:latest
    container_name: garminas-cron
    hostname: garminas
    restart: unless-stopped
    shm_size: "1gb"
    mem_limit: 2g
    environment:
      TZ: Europe/Lisbon
      GARMIN_DATA_DIR: /data
      LLM_URL: http://llm:8080/v1/chat/completions
      LLM_TIMEOUT: 3600
      # Your DSM user, so the files are not owned by root. Leave as is if you
      # do not know them; everything still works, it is just tidier this way.
      PUID: ""
      PGID: ""
    volumes:
      - ./data:/data:z
      - ./models:/models:z
    networks: [default]

  web:
    image: ghcr.io/pjfonseca/garminas:latest
    container_name: garminas-web
    restart: unless-stopped
    command: ["web"]
    shm_size: "1gb"
    mem_limit: 2g
    environment:
      TZ: Europe/Lisbon
      GARMIN_DATA_DIR: /data
      LLM_URL: http://llm:8080/v1/chat/completions
      LLM_TIMEOUT: 3600
      WEB_HOST: 0.0.0.0
      PUID: ""
      PGID: ""
    ports:
      - "8090:8090"
    volumes:
      - ./data:/data:z
      - ./models:/models:z
    networks: [default]

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: garminas-llm
    restart: unless-stopped
    # Waits for the model file rather than dying and restarting while the
    # setup page downloads it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while [ ! -f /models/model.gguf ]; do
          echo "waiting for /models/model.gguf"; sleep 10;
        done;
        exec /app/llama-server
        -m /models/model.gguf
        --host 0.0.0.0 --port 8080
        --ctx-size 8192
        --threads 4
        --n-predict 512
    volumes:
      - ./models:/models:ro,z
    # The model the setup page recommends, Gemma 3 12B, is 6.8 GiB of weights
    # and wants headroom for the KV cache on top. Under a 6g ceiling it does
    # not fit: the weights are evicted and re-read from disk on every token.
    # Measured on a DS923+ that way, one section took 59 minutes at 0.14
    # tokens a second, and the container was then killed with exit 137.
    #
    # This is a ceiling, not a reservation. A 4B model under it uses its 2.5
    # GiB and no more, so the number costs nothing to anyone who picks one.
    mem_limit: 12g
    networks: [default]

networks:
  default:
