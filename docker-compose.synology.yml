# GarmiNAS for Synology Container Manager.
#
# Paste this into a new Container Manager project and it does the rest: it
# pulls the published image, starts the three containers, and serves the setup
# page on port 8090. Nothing to build, nothing to import, no .env file.
#
# It differs from docker-compose.yml in two ways, both because Container
# Manager has no command line to pass flags to: the model service is not behind
# a compose profile, so it starts with everything else, and there is no build
# step. It waits for the model file by itself, logging "waiting for
# /models/model.gguf" until the setup page has downloaded one.
#
# Every setting has a value here rather than in a .env. To change the timezone,
# a memory limit or the port, edit it in the Container Manager editor.

services:
  garmin:
    image: ghcr.io/pjfonseca/garminas:latest
    container_name: garminas-cron
    hostname: garminas
    restart: unless-stopped
    shm_size: "1gb"
    mem_limit: 2g
    environment:
      TZ: Europe/Lisbon
      GARMIN_DATA_DIR: /data
      LLM_URL: http://llm:8080/v1/chat/completions
      LLM_TIMEOUT: 3600
      # Your DSM user, so the files are not owned by root. Leave as is if you
      # do not know them; everything still works, it is just tidier this way.
      PUID: ""
      PGID: ""
    volumes:
      - ./data:/data
      - ./models:/models
    networks: [default]

  web:
    image: ghcr.io/pjfonseca/garminas:latest
    container_name: garminas-web
    restart: unless-stopped
    command: ["web"]
    shm_size: "1gb"
    mem_limit: 2g
    environment:
      TZ: Europe/Lisbon
      GARMIN_DATA_DIR: /data
      LLM_URL: http://llm:8080/v1/chat/completions
      LLM_TIMEOUT: 3600
      WEB_HOST: 0.0.0.0
      PUID: ""
      PGID: ""
    ports:
      - "8090:8090"
    volumes:
      - ./data:/data
      - ./models:/models
    networks: [default]

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: garminas-llm
    restart: unless-stopped
    # Waits for the model file rather than dying and restarting while the
    # setup page downloads it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while [ ! -f /models/model.gguf ]; do
          echo "waiting for /models/model.gguf"; sleep 10;
        done;
        exec /app/llama-server
        -m /models/model.gguf
        --host 0.0.0.0 --port 8080
        --ctx-size 8192
        --threads 4
        --n-predict 512
    volumes:
      - ./models:/models:ro
    # A 4B model needs about 4 GB. Raise to 12g for the 12B, if the NAS has it.
    mem_limit: 6g
    networks: [default]

networks:
  default:
