services:
  garmin:
    # Imagem local, construída no PC e carregada na NAS com `docker load`.
    # Sem registry: pull_policy never evita que o compose tente ir à internet.
    image: garmin-nas:${GARMIN_IMAGE_TAG:-1.0}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garmin
    hostname: garmin
    restart: unless-stopped

    # O Chrome precisa de memória partilhada generosa ou rebenta com
    # "session deleted because of page crash".
    shm_size: "1gb"

    environment:
      TZ: ${TZ:-Europe/Lisbon}
      GARMIN_DATA_DIR: /data
      LLM_URL: http://llm:8080/v1/chat/completions
      PUID: ${PUID:-}
      PGID: ${PGID:-}

    volumes:
      # Base de dados SQLite, ficheiros FIT, perfil do browser e credenciais.
      # Ajustar o caminho do lado esquerdo ao teu NAS.
      # :z rotula para SELinux (Fedora, RHEL). Ignorado onde nao existe.
      - ./data:/data:z
      # O `setup` escreve aqui o modelo escolhido.
      - ./models:/models:z

    # O Chrome ocupa cerca de 1 GB em pico.
    mem_limit: 2g

    # Sem portas expostas: o container não serve nada, apenas sincroniza.
    networks:
      - default

  # Interface web: configurar numa página e ler os relatórios. Corre a mesma
  # imagem, e precisa de memória partilhada porque é ela que abre o Chrome
  # durante a primeira sincronização.
  web:
    image: garmin-nas:${GARMIN_IMAGE_TAG:-1.0}
    pull_policy: never
    container_name: garmin-web
    restart: unless-stopped
    command: ["web"]
    shm_size: "1gb"
    mem_limit: 2g
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      GARMIN_DATA_DIR: /data
      LLM_URL: http://llm:8080/v1/chat/completions
      WEB_HOST: ${WEB_HOST:-0.0.0.0}
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    ports:
      # Acessível a partir de qualquer máquina da rede local. Para restringir
      # ao próprio host, pôr WEB_BIND=127.0.0.1 no .env.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8090}:8090"
    volumes:
      - ./data:/data:z
      - ./models:/models:z
    networks:
      - default

  # Modelo local. Opcional, e por isso atrás de um profile: sem um .gguf em
  # ./models o llama.cpp entrava em ciclo de reinício. O relatório sai na mesma
  # quando o modelo não responde, apenas sem a parte redigida.
  #
  #   docker compose up -d                 -> só a sincronização
  #   docker compose --profile llm up -d   -> sincronização + treinador redigido
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: garmin-llm
    profiles: [llm]
    restart: unless-stopped
    # Espera pelo ficheiro em vez de morrer e reiniciar em ciclo: quando a
    # página web está a descarregar o modelo, ele ainda não existe.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while [ ! -f /models/${MODEL_FILE:-model.gguf} ]; do
          echo "à espera de /models/${MODEL_FILE:-model.gguf}"; sleep 10;
        done;
        exec /app/llama-server
        -m /models/${MODEL_FILE:-model.gguf}
        --host 0.0.0.0 --port 8080
        --ctx-size ${LLM_CTX:-4096}
        --threads ${LLM_THREADS:-4}
        --n-predict 384
    volumes:
      - ./models:/models:ro,z
    # Um 4B em Q4 precisa de cerca de 4 GB; um 12B de perto de 10. Se o
    # limite ficar abaixo do modelo, o container morre sem explicação útil.
    mem_limit: ${LLM_MEM:-6g}
    networks:
      - default
