# Catálogo de treinos. O motor filtra por regras; o modelo escolhe apenas de
# entre os candidatos elegíveis e escreve a justificação. Isto impede que um
# modelo pequeno invente sessões absurdas para o estado atual.
#
# Campos de elegibilidade (todos opcionais):
#   tsb_min / tsb_max        janela de Training Stress Balance
#   days_since_hard_min      dias desde a última sessão de carga >= 100
#   ctl_min                  base aeróbia mínima antes de permitir a sessão
#   requires_fresh           exige que não haja bandeira de recuperação ativa
#
# ritmo é a instrução de velocidade. Os marcadores {facil}, {forte}, {tempo} e
# {caminhada} são preenchidos com as velocidades calculadas a partir do
# historial da própria pessoa, não com valores de tabela.
#
# load_est é a carga estimada da sessão, usada para projetar CTL/ATL/TSB ao
# longo do plano. Não precisa de ser exata; precisa de ser coerente entre
# sessões, para que a progressão simulada faça sentido.

# --- Objetivo ---------------------------------------------------------------
# Com perder_peso ativo, o plano prefere volume fácil a descanso completo:
# caminhar gasta energia e quase não cobra recuperação. Não mexe na
# intensidade, que é o que magoa, nem passa por cima das bandeiras.
#
# O ritmo saudável é 0.25% a 0.75% do peso corporal por semana. Mais depressa
# do que isso perde-se músculo, e a balança volta a subir a seguir.
objetivo:
  perder_peso: true
  ritmo_pct_semana: [-0.75, -0.25]
  dias_descanso_por_semana: 1     # o resto passa a caminhada leve

# --- Bloqueio de segurança ---------------------------------------------------
# Se qualquer destas condições se verificar, só sessões marcadas
# "recovery_safe" ficam elegíveis. Avaliado em código, não pelo modelo.
recovery_flags:
  rhr_delta_above: 5          # FC repouso 7d mais de 5 bpm acima da base 28d
  hrv_drop_pct_below: -12     # HRV 7d mais de 12% abaixo da base
  sleep_h_below: 6.0          # média de sono a 7 dias abaixo de 6 horas
  tsb_below: -25              # fadiga acumulada excessiva

workouts:
  - id: rest
    name: Descanso completo
    load_est: 0
    recovery_safe: true
    description: Sem treino estruturado. Caminhada leve se apetecer.

  - id: easy_walk
    name: Caminhada longa
    load_est: 20
    ritmo: "Anda a {caminhada} km/h, sem inclinação."
    recovery_safe: true
    duration_min: 45
    description: Ritmo conversável, zona 1. Mantém o hábito sem adicionar carga.

  - id: easy_run
    name: Corrida fácil
    load_est: 45
    ritmo: "Passadeira a {facil} km/h. Se a conversa começar a custar, baixa meio km/h."
    recovery_safe: true
    duration_min: 35
    tsb_min: -20
    description: >
      Zona 2 do princípio ao fim. Se não consegues falar em frases inteiras,
      abranda. É esta sessão que constrói a base aeróbia.

  - id: treadmill_base
    name: Passadeira contínua
    load_est: 50
    ritmo: "Passadeira a {facil} km/h com 1% de inclinação."
    recovery_safe: true
    duration_min: 40
    tsb_min: -20
    description: >
      Inclinação 1%, ritmo constante em zona 2. A inclinação compensa a
      ausência de resistência do ar.

  - id: treadmill_intervals_short
    name: Intervalos curtos na passadeira
    load_est: 85
    ritmo: "Aquecimento a {facil} km/h. Cada minuto forte a {forte} km/h, e a recuperação a andar a {caminhada} km/h."
    duration_min: 35
    tsb_min: -10
    days_since_hard_min: 2
    requires_fresh: true
    description: >
      10 min aquecimento, depois 8 x (1 min forte / 90 s a andar),
      10 min a arrefecer. Entrada suave no trabalho anaeróbio.

  - id: treadmill_intervals_long
    name: Intervalos longos na passadeira
    load_est: 120
    ritmo: "Aquecimento a {facil} km/h. Os 3 minutos fortes a {forte} km/h, os 2 minutos fáceis a {facil} km/h."
    duration_min: 50
    tsb_min: -5
    ctl_min: 25
    days_since_hard_min: 3
    requires_fresh: true
    description: >
      15 min aquecimento, 5 x (3 min a ritmo forte / 2 min fácil),
      10 min a arrefecer. Puxa pelo aeróbio alto.

  - id: tempo
    name: Contínuo em ritmo controlado
    load_est: 105
    ritmo: "Os 20 minutos do meio a {tempo} km/h. Fica entre o fácil e o forte, incómodo mas sustentável."
    duration_min: 45
    tsb_min: -8
    ctl_min: 30
    days_since_hard_min: 3
    requires_fresh: true
    description: >
      15 min fácil, 20 min a ritmo de esforço confortavelmente difícil,
      10 min fácil.

  - id: long_run
    name: Corrida longa
    load_est: 95
    ritmo: "Tudo a {facil} km/h ou menos. Se tiveres de abrandar no fim, abranda."
    duration_min: 75
    tsb_min: -12
    ctl_min: 25
    days_since_hard_min: 2
    description: Tudo em zona 2. Aumentar no máximo 10% face à mais longa recente.

  - id: strength
    name: Força para corredores
    load_est: 30
    recovery_safe: true
    duration_min: 30
    description: >
      Agachamentos, afundos, elevação de gémeos, prancha. Duas a três séries.
      Complementa sem competir pela mesma recuperação.
